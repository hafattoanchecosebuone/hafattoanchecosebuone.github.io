<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.descrizione }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  {{- $descrizione := .Site.Params.descrizione }}
  {{- with .Params.fatto }}{{ $descrizione = . }}{{ else with .Params.descrizione }}{{ $descrizione = . }}{{ end }}
  <meta name="description" content="{{ $descrizione }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ $descrizione }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="{{ if eq .Section "bufale" }}{{ if .IsPage }}article{{ else }}website{{ end }}{{ else }}website{{ end }}">
  <meta property="og:locale" content="it_IT">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:image" content="{{ "og-image.jpg" | absURL }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ "favicon.ico" | relURL }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ "favicon-512.png" | relURL }}">
  <link rel="preload" href="{{ "fonts/archivo-normal-var-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
